workflows:
  stadiome-workflow:
    name: Stadiome Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Build Android
        script: |
          flutter clean
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
      - name: Build iOS Archive
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination "generic/platform=iOS" -archivePath $HOME/result.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - $HOME/result.xcarchive/**/*.app