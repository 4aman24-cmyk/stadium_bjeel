workflows:
  stadiome-workflow:
    name: Stadiome Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          cd stadiome_app
          flutter pub get
      - name: Build Android APK
        script: |
          cd stadiome_app
          flutter build apk --release
      - name: Build iOS App
        script: |
          cd stadiome_app
          flutter build ios --release --no-codesign
    artifacts:
      - stadiome_app/build/app/outputs/flutter-apk/*.apk
      - stadiome_app/build/ios/iphoneos/*.app