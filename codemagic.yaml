workflows:
  stadiome-workflow:
    name: Stadiome Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Clean and Set Java 17 for Build
        script: |
          cd stadiome_app
          # Ensure Java 17 environment variables are locked
          export JAVA_HOME=$HOME/Library/Java/JavaVirtualMachines/temurin-17*/Contents/Home || export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          java -version
          
          # Force Gradle 8.4 (which natively supports Java 21/17 fully without throwing this error)
          mkdir -p android/gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" > android/gradle/wrapper/gradle-wrapper.properties
      - name: Get Flutter packages
        script: |
          cd stadiome_app
          flutter clean
          flutter pub get
      - name: Build Android APK
        script: |
          cd stadiome_app
          flutter build apk --release
      - name: Build iOS App
        script: |
          cd stadiome_app
          flutter build ios --release --no-codesign