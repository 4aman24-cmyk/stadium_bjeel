workflows:
  stadiome-workflow:
    name: Stadiome Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fix Gradle Version Automatically
        script: |
          cd stadiome_app
          mkdir -p android/gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" > android/gradle/wrapper/gradle-wrapper.properties
      - name: Get Flutter packages
        script: |
          cd stadiome_app
          flutter clean
          flutter pub get
      - name: Build Android APK
        script: |
          cd stadiome_app
          flutter build apk --release
      - name: Build iOS App
        script: |
          cd stadiome_app
          flutter build ios --release --no-codesign