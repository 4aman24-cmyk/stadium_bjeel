workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    working_directory: stadiome_app
    triggering:
      events:
        - push
    scripts:
      - name: Flutter build
        script: |
          flutter build apk --release
          flutter build ios --release --no-codesign
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/iphoneos/*.app
      