workflows:
  stadiome-workflow:
    name: Stadiome Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Build iOS and Android with Debug
        script: |
          flutter clean
          flutter pub get
          echo "Building iOS..."
          flutter build ios --release --no-codesign || true
          echo "Checking build directories..."
          find build -name "*.app"
          find build -name "*.ipa"
          echo "Building Android..."
          flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/ios/**/*.app
      - build/ios/**/*.ipa
      - build/app/outputs/flutter-apk/*.apk